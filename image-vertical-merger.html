async function addFiles(files){if(busy||!files.length)return;lock(true);let added=0;const errors=[];try{for(let i=0;i<files.length;i++){const file=files[i];say(`이미지 읽는 중… ${i+1} / ${files.length}`);$('progress').max=files.length;$('progress').value=i;let decoded=null,thumbCanvas=null;try{if(!/\.(png|jpe?g|webp)$/i.test(file.name)&&!/^image\/(png|jpeg|webp)$/i.test(file.type))throw new Error('지원하지 않는 파일 형식입니다.');decoded=await decode(file);const w=decoded.width||decoded.naturalWidth,h=decoded.height||decoded.naturalHeight;if(!w||!h)throw new Error('이미지 해상도를 읽을 수 없습니다.');const outH=Math.max(1,Math.round(h*(WIDTH/w)));thumbCanvas=document.createElement('canvas');const scale=Math.min(1,248/w,248/h);thumbCanvas.width=Math.max(1,Math.round(w*scale));thumbCanvas.height=Math.max(1,Math.round(h*scale));const ctx=thumbCanvas.getContext('2d');if(!ctx)throw new Error('썸네일 Canvas 생성에 실패했습니다.');ctx.drawImage(decoded,0,0,thumbCanvas.width,thumbCanvas.height);const thumb=URL.createObjectURL(await blobOf(thumbCanvas));if(!added)invalidate();items.push({id:nextId++,file,w,h,outH,thumb});added++}catch(e){errors.push(`${file.name}: ${e.message||'손상되었거나 디코딩할 수 없는 이미지입니다.'}`)}finally{dispose(decoded);if(thumbCanvas){thumbCanvas.width=0;thumbCanvas.height=0}}$('progress').value=i+1;await pause()}}finally{lock(false)}say(`${added}개 이미지를 추가했습니다.${added?' PNG 생성을 눌러 주세요.':''}${errors.length?'\n다음 파일은 추가하지 못했습니다.\n'+errors.join('\n'):''}`,errors.length>0)}
async function generate(){if(busy)return;if(!$('gap').checkValidity()){$('gap').reportValidity();say('이미지 사이 간격은 0~32,767 사이의 정수 픽셀로 입력해 주세요.',true);return}if(!items.length){say('먼저 병합할 이미지를 선택해 주세요.',true);return}invalidate();const height=totalHeight();if(!Number.isSafeInteger(height)||height>MAX_HEIGHT){say(TOO_TALL,true);return}lock(true);let canvas=null;try{say('병합용 Canvas를 준비하고 있습니다…');await pause();canvas=document.createElement('canvas');canvas.width=WIDTH;canvas.height=height;const ctx=canvas.getContext('2d',{willReadFrequently:true});if(!ctx)throw new Error('Canvas 생성에 실패했습니다. 메모리가 부족할 수 있으니 이미지 개수를 줄여 주세요.');ctx.fillStyle='#ff00ff';ctx.fillRect(WIDTH-1,height-1,1,1);const probe=ctx.getImageData(WIDTH-1,height-1,1,1).data;if(probe[0]!==255||probe[3]!==255)throw new Error(TOO_TALL);ctx.clearRect(0,0,WIDTH,height);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';let y=0;$('progress').max=items.length+1;for(let i=0;i<items.length;i++){say(`이미지 병합 중… ${i+1} / ${items.length}`);let img=null;try{img=await decode(items[i].file);ctx.drawImage(img,0,y,WIDTH,items[i].outH)}catch(e){throw new Error(`${items[i].file.name}: 이미지 처리에 실패했습니다. 파일 손상 또는 메모리 부족일 수 있습니다.`)}finally{dispose(img)}y+=items[i].outH+(i<items.length-1?getGap():0);$('progress').value=i+1;await pause()}say('PNG 파일로 변환하고 있습니다…');await pause();const blob=await blobOf(canvas);resultURL=URL.createObjectURL(blob);$('preview').src=resultURL;$('save').href=resultURL;$('metadata').textContent=`840 × ${height.toLocaleString()}px | ${items.length}개 이미지 | ${formatSize(blob.size)}`;$('result').hidden=false;$('progress').value=items.length+1;say('완료되었습니다. PNG 저장 버튼으로 다운로드하세요.')}catch(e){invalidate();say(e.message||'이미지를 생성하지 못했습니다. 메모리가 부족할 수 있으니 이미지 개수를 줄여 다시 시도해 주세요.',true)}finally{if(canvas){canvas.width=0;canvas.height=0}lock(false)}}
function formatSize(size){return size<1024*1024?(size/1024).toFixed(1)+' KB':(size/1024/1024).toFixed(2)+' MB'}
$('gap').addEventListener('input',()=>{if(busy)return;invalidate();render();say($('gap').checkValidity()?'간격이 변경되었습니다. PNG 생성을 눌러 새 결과를 만들어 주세요.':'이미지 사이 간격은 0~32,767 사이의 정수 픽셀로 입력해 주세요.',!$('gap').checkValidity())});
$('drop').onclick=$('add').onclick=()=>{if(!busy)$('files').click()};$('files').onchange=e=>{const files=Array.from(e.target.files);e.target.value='';addFiles(files)};$('clear').onclick=()=>{if(busy)return;items.forEach(release);items=[];changed()};$('generate').onclick=generate;
$('drop').ondragover=e=>{e.preventDefault();if(!busy&&dragId===null)$('drop').classList.add('over')};$('drop').ondragleave=()=>$('drop').classList.remove('over');$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('over');if(!busy&&dragId===null)addFiles(Array.from(e.dataTransfer.files))};window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>e.preventDefault());window.addEventListener('pagehide',e=>{if(!e.persisted){invalidate();items.forEach(release);items=[]}});render();
</script><script data-ui-only>// Touch/pen reorder delegates to the existing arrow buttons and their state handling.
(()=>{
 const list=document.getElementById('list');let drag=null;
 list.addEventListener('pointerdown',e=>{
  const handle=e.target.closest('.number'),row=handle?.closest('li');
  if(!row||e.pointerType==='mouse'||!row.draggable)return;
  e.preventDefault();drag={id:row.dataset.id,target:row.dataset.id,pointer:e.pointerId};
  handle.setPointerCapture(e.pointerId);row.classList.add('target');
 });
 list.addEventListener('pointermove',e=>{
  if(!drag||drag.pointer!==e.pointerId)return;e.preventDefault();
  const row=document.elementFromPoint(e.clientX,e.clientY)?.closest('#list li');
  if(row){drag.target=row.dataset.id;list.querySelectorAll('.target').forEach(x=>x.classList.remove('target'));row.classList.add('target')}
 });
 list.addEventListener('pointerup',e=>{
  if(!drag||drag.pointer!==e.pointerId)return;
  const current=drag;drag=null;const rows=[...list.children];
  let from=rows.findIndex(x=>x.dataset.id===current.id),to=rows.findIndex(x=>x.dataset.id===current.target);
  if(from<0||to<0)return;
  const direction=to>from?1:0;
  while(from!==to){const row=[...list.children].find(x=>x.dataset.id===current.id),button=row?.querySelectorAll('.controls button')[direction];if(!button||button.disabled)break;button.click();from+=direction?1:-1}
  list.querySelectorAll('.target').forEach(x=>x.classList.remove('target'));
 });
 list.addEventListener('pointercancel',()=>{drag=null;list.querySelectorAll('.target').forEach(x=>x.classList.remove('target'))});
})();
</script><script>if(location.protocol==='file:')document.querySelectorAll('.media-home').forEach(link=>{link.hidden=true});</script></body></html>
